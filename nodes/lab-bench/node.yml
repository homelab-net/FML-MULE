---
# The lab bench node: an imperfect stand-in for the field prototype on the
# development machine. Same schema as a field node (nodes/mule-v001/), so moving
# to the prototype is a descriptor swap, not a code change (FML-ADR-045 role
# model). Every field-vs-lab substitution is recorded in docs/dev-machine.md.

node:
  id: lab-bench

# What this bench fields. AP and mesh are kept SEPARATE functions: the AP+mesh
# consolidation (TBR-RF-03) is OPEN and unproven, so the bench must not assume it.
active_bearers:
  - wifi_ap
  - wifi_mesh

# Logical role -> concrete device on THIS machine. Code and bring-up reference
# the role; only this map changes between lab and field. Radios are identified by
# driver, never by a fuzzy name match.
# DEVIATION, observed 2026-10-02, updated 2026-10-03: the box is not currently
# wired this way. The USB adapter is running as the AP and the onboard radio is
# the client holding the default route -- the roles below, reversed, and the
# ap_channel below not in use. docs/bench-service-bringup.md records the revert
# ("the restored earlier interface roles"); this file was written for the
# 2026-10-01 arrangement and was not updated.
#
# 2026-10-03: the AP was moved from 2.4 GHz channel 11 to 5 GHz channel 149 on
# Owner instruction, because both radios sharing 2.4 GHz was slowing the WAN
# path through the node. So the band-separation intent the ap_channel comment
# below describes -- a 5 GHz AP beside a 2.4 GHz WAN client -- is now met, but
# with the roles reversed from this file and on 149 rather than 36. The AP runs
# at 40 MHz: 80 MHz was requested and the rtl8812au driver did not deliver it,
# silently. Recorded with the evidence in
# docs/evidence/TBR-RF-03/2026-10-03-bench-ap-band-coexistence-and-radio-capability.md.
#
# These values are left as the DECIDED arrangement, not edited to match the box,
# because matching it would silently discard the 5 GHz coexistence mitigation
# that docs/dev-machine.md validated on 2026-09-14. Until the two agree,
# test/bench/mule-ap-up.sh refuses here -- correctly, because eud_ap below
# resolves to the current default-route device.
interfaces:
  # WAN: stand-in only. Field is Ethernet (USB-C-to-Ethernet, BOM v0.4). Here it
  # is the RTL8812AU USB client, because it is the box's only uplink until a
  # wired link is available. Rebinding to the Ethernet device is a one-line
  # change here, no code rework.
  wan: wlx00c0caa741fe
  # EUD AP on the onboard integrated Wi-Fi (rtw89_8852be, phy0) -- the field's
  # onboard-integrated-radio-as-AP role (FML-ADR-045).
  eud_ap: wlp2s0
  # High-rate mesh on mac80211_hwsim -- a mesh-capable mac80211 radio, standing
  # in for the QCA6174A on M.2. The RF medium is simulated (hwsim).
  mesh: wlan0
  # No HaLow or LoRa radio on this box; those bearers are faked on the software digital twin.
  halow: none
  lora: none

# EUD AP channel for the bench. In the field this is regulatory data from
# gen-config + the region profile, not a node property; here it is a bench value
# on 5 GHz so the onboard AP does not desense the 2.4 GHz USB WAN client -- the
# co-located-2.4 GHz coexistence limit recorded in docs/dev-machine.md.
ap_channel: 36
