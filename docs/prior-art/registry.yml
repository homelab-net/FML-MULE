        Firmware source is GPL-3.0; board builds combine PlatformIO libraries,
        bootloaders and vendor components that require a complete image review.
    maintenance:
      release_cadence: >-
        The latest non-prerelease release was published 2026-06-24; newer 2.8.0
        prereleases and default-branch commits continued through September 2026.
      latest_release_date: "2026-06-24"
      last_commit_date: "2026-09-11"
      issue_backlog: 216
      bus_factor: >-
        GitHub contributor totals show several high-volume maintainers and a
        broad contributor base.
      sources:
        - https://github.com/meshtastic/firmware/releases
        - https://api.github.com/repos/meshtastic/firmware/contributors
        - https://github.com/meshtastic/firmware/issues
    platform:
      hardware:
        - Board profiles based on ESP32
        - Board profiles based on nRF52
        - Board profiles based on RP2040 and RP2350
        - Linux-native devices
      operating_systems:
        - Bare-metal and RTOS board firmware by profile
        - Linux-native meshtasticd
      architectures:
        - Board-profile dependent ARM, Xtensa and Linux host architectures
      sources:
        - https://github.com/meshtastic/firmware/blob/54e0d8d0ab2ff56b3a9ce967e53f79e49af560fb/README.md
        - https://github.com/meshtastic/firmware/tree/54e0d8d0ab2ff56b3a9ce967e53f79e49af560fb/variants
        - https://github.com/meshtastic/firmware/blob/54e0d8d0ab2ff56b3a9ce967e53f79e49af560fb/platformio.ini
    resources:
      status: not-measured
      measurements: []
    runtime:
      ports:
        - TCP 4403 Meshtastic client API when an IP interface is enabled
        - MQTT broker endpoint only when configured
        - USB serial, UART and Bluetooth interfaces are platform dependent
      privileges:
        - Full control of the target MCU, attached radio and board peripherals
        - Linux-native device and TLS file access depends on its service profile
      capabilities:
        - LoRa mesh text, position and telemetry transport
        - Meshtastic client API over serial, Bluetooth or IP by platform
        - Optional MQTT uplink and downlink
      mounts:
        - MCU flash filesystem or Linux-native configuration and state paths
      secrets:
        - Channel pre-shared keys and device private keys
        - MQTT credentials when enabled
        - Linux-native TLS private key and certificate
      authentication: >-
        Configured channel encryption and optional public-key cryptography can
        protect mesh traffic. Stock nodes share a published compiled-in default
        channel key, so that profile provides no meaningful confidentiality and
        blocks FML approval. An owner-approved separation and confidentiality
        control remains to be selected. Client API and MQTT trust also depend on
        the selected device profile.
      update_behavior: >-
        Firmware is flashed through board-specific serial, web, OTA or DFU flows.
        Promotion therefore requires an exact board artifact and rollback method.
      sources:
        - https://github.com/meshtastic/firmware/blob/54e0d8d0ab2ff56b3a9ce967e53f79e49af560fb/src/mesh/api/ethServerAPI.cpp
        - https://github.com/meshtastic/firmware/blob/54e0d8d0ab2ff56b3a9ce967e53f79e49af560fb/src/mesh/Channels.h
        - https://github.com/meshtastic/firmware/blob/54e0d8d0ab2ff56b3a9ce967e53f79e49af560fb/src/mesh/Channels.cpp
        - https://github.com/meshtastic/firmware/tree/54e0d8d0ab2ff56b3a9ce967e53f79e49af560fb/src/mesh/api
        - https://github.com/meshtastic/firmware/tree/54e0d8d0ab2ff56b3a9ce967e53f79e49af560fb/src/mqtt
    data:
      formats:
        - Meshtastic protobuf configuration and packets
        - Board flash preferences, node database and message store
        - Linux-native configuration, keys and certificates
      persistence: >-
        Board profiles persist configuration, keys, node state and optional
        messages in flash; exact paths and capacity are platform dependent.
      backup: >-
        Export and reprovision the approved channel and device configuration;
        no universal whole-device backup contract was identified.
      migration: >-
        Firmware and stored-state compatibility are release and board dependent;
        the selected board profile requires a tested upgrade and rollback path.
      sources:
        - https://github.com/meshtastic/firmware/blob/54e0d8d0ab2ff56b3a9ce967e53f79e49af560fb/src/mesh/NodeDB.cpp
        - https://github.com/meshtastic/firmware/blob/54e0d8d0ab2ff56b3a9ce967e53f79e49af560fb/src/MessageStore.cpp
        - https://github.com/meshtastic/firmware/blob/54e0d8d0ab2ff56b3a9ce967e53f79e49af560fb/src/mesh/api/ServerAPI.cpp
    security:
      reviewed_on: "2026-09-10"
      advisory_sources:
        - https://github.com/meshtastic/firmware/security/advisories
      known_advisories:
        - >-
          GHSA-7ph5-2mjv-69h8 is high severity, affects versions through
          2.7.22.96dd647 and declares no patched version; evaluated 2.7.26 is
          outside the stated affected range.
        - >-
          GHSA-mjx5-98jq-q736 is critical and concerns arbitrary code execution
          in a pull_request_target workflow; no affected or patched range is declared.
        - >-
          GHSA-95pq-gj5v-4fg2, GHSA-33hw-xhfh-944r, GHSA-vqcq-wjwx-7252 and
          GHSA-3x3r-vw9f-pxq5 are high or critical runtime advisories with
          declared patched releases earlier than the evaluated release.
        - >-
          GHSA-gq7v-jr8c-mfr7, GHSA-6mwm-v2vv-pp96, GHSA-377p-prwp-4hwf,
          GHSA-c967-qc39-3hf5, GHSA-xfmq-5j3j-vgv8, GHSA-h8mh-p4r3-4jv7,
          GHSA-4hjx-54gf-2jh7 and GHSA-4q84-546j-3mf5 declare patched releases
          earlier than 2.7.26; one concerns the build workflow rather than
          firmware runtime.
        - >-
          GHSA-45vg-3f35-7ch2 is high severity, affects versions before 2.6.2
          and declares no patched version; evaluated 2.7.26 is outside the range.
        - >-
          GHSA-h79j-c836-5j74 is low severity and declares all Linux-native
          versions affected because generated TLS key material is world-readable;
          it has no declared patched version and remains relevant to meshtasticd.
      audit_status: No independent audit was identified in the pinned repository artifact.
      sbom_status: >-
        No repository SBOM was identified; PlatformIO dependency declarations
        and locks do not replace a board-specific firmware SBOM.
    mappings:
      requirements: [FML-REQ-013, FML-REQ-014, FML-REQ-030]
      findings: [OSS-01]
    reuse:
      mode: adopt
      rationale: >-
        FML-ADR-026 selects Meshtastic as the separate non-IP degraded bearer;
        FML-ADR-048 and FML-ADR-070 constrain integration to upstream semantics.
      approval_ref: docs/adr/FML-ADR-026-lora-meshtastic-separate-non-ip-plane.md
    prototype:
      status: not-run
      commands:
        - git clone https://github.com/meshtastic/firmware.git
        - git checkout 54e0d8d0ab2ff56b3a9ce967e53f79e49af560fb
        - platformio run -e selected-board-profile
      evidence:
        - docs/prior-art/meshtastic-firmware.md
        - docs/evidence/TBR-NET-02/2026-09-06-geochat-to-survives-the-meshtastic-bearer.md
      gaps:
        - Exact release source was not built for a selected board in this intake
        - Existing meshtasticd evidence is SIMULATED and establishes no RF behavior
        - Board selection, RF, power, thermal and update rollback remain open
        - >-
          The published default key is not confidential and blocks profile
          approval; the replacement control remains unselected
        - Complete dependency, firmware-image, license and SBOM review remains pending
        - Linux-native TLS key permissions remain affected by GHSA-h79j-c836-5j74
    exit_strategy: >-
      Keep TAK-to-Meshtastic integration at upstream protocol boundaries so the
      approved degraded bearer can change without a custom EUD or TAK protocol.
    decision_questions:
      - Which exact board and immutable firmware artifact enter the compatibility set?
      - >-
        Which owner-approved separation and confidentiality control replaces
        the stock public default?
      - Does the selected hardware reproduce the simulated recipient semantics over RF?
      - Is Linux-native meshtasticd permitted before its TLS key permissions are remediated?
