        - Optional GNSS and audio devices
        - Hardware-free frontend-only development mode
      operating_systems:
        - Linux
        - OpenWrt when installed by OpenMANET firmware
      architectures:
        - Not declared independently of the target firmware build
      sources:
        - https://github.com/OpenMANET/openmanetd/blob/beaf76c54b65cbaba7b998d1f7bacf9c35f5c6a1/README.md
        - https://github.com/OpenMANET/openmanetd/blob/beaf76c54b65cbaba7b998d1f7bacf9c35f5c6a1/docs/GETTING_STARTED.md
    resources:
      status: not-measured
      measurements: []
    runtime:
      ports:
        - TCP 8087 for ConnectRPC, HTTP and WebSocket API traffic
        - TCP 8081 for the embedded frontend
      privileges:
        - >-
          Node management requires authority to change radios, interfaces,
          DHCP, routes, services and reboot state
      capabilities:
        - batman-adv and Alfred state publication
        - Wi-Fi, DHCP, interface, VXLAN and Tailscale control
        - GNSS, CoT and optional audio device access
      mounts:
        - /etc/openmanetd for configuration and SQLite state
        - /var/run/alfred.sock by default
        - Optional GNSS, audio and HID device paths
      secrets:
        - PAM-backed administrator credentials
        - In-memory session tokens
        - Optional Tailscale authentication key
        - Optional TLS private key
      authentication: >-
        Runtime source defaults PAM-backed authentication on when auth.enable
        is absent. The pinned guide contradicts the code by stating that the
        default is off and says a fresh node starts with root and no password;
        runtime source governs and credential bootstrap needs prototype proof.
      update_behavior: >-
        Release binaries and OpenWrt packaging are external to the daemon; no
        autonomous updater is described in the pinned documentation.
      sources:
        - https://github.com/OpenMANET/openmanetd/blob/beaf76c54b65cbaba7b998d1f7bacf9c35f5c6a1/README.md
        - https://github.com/OpenMANET/openmanetd/blob/beaf76c54b65cbaba7b998d1f7bacf9c35f5c6a1/docs/api-authentication.md
        - https://github.com/OpenMANET/openmanetd/blob/beaf76c54b65cbaba7b998d1f7bacf9c35f5c6a1/internal/config/config.go
    data:
      formats:
        - YAML configuration
        - SQLite database
        - Protobuf and JSON RPC messages
        - CoT and NMEA output
        - Optional JSON instrumentation snapshots
      persistence: >-
        Configuration and SQLite state default under /etc/openmanetd; sessions
        are memory-only and are lost on restart.
      backup: No backup contract was identified in the pinned documentation.
      migration: >-
        Database schema generation exists, but no operator migration contract
        was identified in the pinned documentation.
      sources:
        - https://github.com/OpenMANET/openmanetd/blob/beaf76c54b65cbaba7b998d1f7bacf9c35f5c6a1/README.md
        - https://github.com/OpenMANET/openmanetd/blob/beaf76c54b65cbaba7b998d1f7bacf9c35f5c6a1/docs/api-authentication.md
        - https://github.com/OpenMANET/openmanetd/blob/beaf76c54b65cbaba7b998d1f7bacf9c35f5c6a1/docs/instrumentation-snapshot.md
    security:
      reviewed_on: "2026-09-10"
      advisory_sources:
        - https://github.com/OpenMANET/openmanetd/security/advisories
      known_advisories: []
      audit_status: No independent audit was identified in the pinned repository artifact.
      sbom_status: >-
        No repository SBOM was identified; Go and frontend dependency scans
        remain pending.
    mappings:
      requirements: [FML-REQ-011, FML-REQ-012, FML-REQ-017, FML-REQ-022, FML-REQ-032]
      findings: [OSS-01]
    reuse:
      mode: pattern-only
      rationale: >-
        FML-ADR-023 and FML-ADR-027 permit reference and prototype use but do
        not select this broad privileged API as the production control plane.
      approval_ref: null
    prototype:
      status: not-run
      commands:
        - git clone https://github.com/OpenMANET/openmanetd.git
        - git checkout beaf76c54b65cbaba7b998d1f7bacf9c35f5c6a1
        - make build-lite
        - make test
        - ./bin/openmanetd frontend --api-address http://127.0.0.1:8087
      evidence:
        - docs/prior-art/openmanetd.md
      gaps:
        - No build or dependency scan in the current intake
        - No least-privilege production service profile
        - No MULE-host resource measurements
        - Authentication documentation contradicts the pinned runtime default
        - No evidence of deterministic coexistence scan or transmit-suppression controls
    exit_strategy: >-
      Retain no production dependency; wrap only an owner-approved narrow
      surface if a later trade selects it.
    decision_questions:
      - Does any reader save more maintenance than direct kernel or service interfaces?
      - Which control endpoints, if any, are supported and least-privilege compatible?
