# The root partition, as mkosi 25.3 defines it by default (mkosi/__init__.py,
# make_disk: Type=root, the distribution's filesystem, CopyFiles=/,
# Minimize=guess), plus a fixed label. When a repart directory is given mkosi
# uses none of its defaults, so the definition is restated here.
#
# repart.d(5): Label= "If not specified, a label derived from the partition
# type is automatically used", and Format= "The file system UUID and label are
# automatically derived from the partition UUID and label." The fixed label
# is what /etc/default/raspi-firmware's ROOTPART=LABEL=mule-root names; an
# unstated label would leave the kernel command line guessing.
[Partition]
Type=root
Format=ext4
Label=mule-root
CopyFiles=/
Minimize=guess
