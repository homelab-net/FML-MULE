# FML-ADR-088: the FAT partition the Pi 4 EEPROM bootloader reads.
#
# repart.d(5), systemd 257: CopyFiles= "Takes a pair of colon separated
# absolute file system paths. The first path refers to a source file or
# directory on the host"; with --root= (mkosi passes --root=/buildroot) "the
# source paths are taken relative to the specified root directory". So this
# copies the image's /boot/firmware, which raspi-firmware populated.
#
# The rpi-eeprom release of 2020-09-14 adds "support GPT and Hybrid MBR
# partition tables"; an earlier one resolves "USB boot fails if the GPT
# contains no basic data or EFI partitions". Type=esp is the EFI partition type.
# Size is mkosi 25.3's own default ESP size (mkosi/__init__.py, make_disk).
[Partition]
Type=esp
Format=vfat
CopyFiles=/boot/firmware:/
SizeMinBytes=512M
SizeMaxBytes=512M
