# FML-ADR-088: the Raspberry Pi 4B development image as an arm64 profile of the
# FML-ADR-079 image. Select it with `--profile pi4b-arm64`; without it the base
# mkosi.conf builds the x86-64 image unchanged.
#
# Pinned mkosi v25.3 manual: profiles "are included after parsing the
# mkosi.conf.d/*.conf drop in configuration", and "Settings that take a
# collection of values are merged by appending the new values to the
# previously configured values. Assigning the empty string to such a setting
# removes all previously assigned values". Single-value settings here override
# the base; the list settings below are emptied first, so no x86-64 value
# carries into this profile. Relative paths resolve against this directory.

[Distribution]
# Manual: "The architecture to build the image for." Omission inherits the
# base x86-64. Building it on an x86-64 host needs a registered qemu-user
# binfmt handler (FML-ADR-088: the N150 cross-build).
Architecture=arm64

[Output]
# Manual: ImageId is "a short identifier for the image"; it also names the
# output files and is passed to scripts as $IMAGE_ID. Omission inherits the
# base identifier and the two profiles' artifacts would collide.
ImageId=mule-development-pi4b
# Manual: Seed makes systemd-repart's partition metadata deterministic.
# UUIDv5 of https://feral-mule.invalid/FML-ADR-088/pi4b-development-image.
Seed=ffd54b38-cb96-56e2-bdde-2b37c1bdec53

[Content]
# Manual: Bootable "enables or disables generation of a bootable image."
# FML-ADR-088: "No UEFI bootloader shall be installed: Bootable=no. This is
# load-bearing". mkosi exports INITRD=No to the package manager unless
# Bootable is disabled (mkosi/installer/apt.py), and raspi-firmware's kernel
# hook copies nothing without an initrd, so omission builds a silent failure.
Bootable=no
# Manual: Bootloader defaults to systemd-boot. The Pi's EEPROM loads the GPU
# firmware and config.txt from the FAT partition; no loader is installed.
Bootloader=none
# Emptied: the base serial console and target are for the x86-64 QEMU boot.
# raspi-firmware writes cmdline.txt itself, and nothing reads this setting when
# the image is not bootable. The Pi's parameters are in mkosi.postinst.chroot.
KernelCommandLine=

[Build]
# Emptied, then set: systemd ENVIRONMENT.md: SYSTEMD_REPART_MKFS_OPTIONS_<FSTYPE>
# configures additional mkfs arguments. mke2fs otherwise chooses a random
# directory hash seed. Reuse this profile's Seed so its raw image is
# deterministic, as the base does with its own seed.
Environment=
Environment=SYSTEMD_REPART_MKFS_OPTIONS_EXT4="-E hash_seed=ffd54b38-cb96-56e2-bdde-2b37c1bdec53"
# Emptied, then set: this profile's sandbox adds non-free-firmware for
# raspi-firmware (FML-ADR-088). The base sandbox would otherwise also apply.
SandboxTrees=
SandboxTrees=sandbox-target
