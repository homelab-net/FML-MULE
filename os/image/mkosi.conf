# FML-ADR-079. mkosi manual pinned at upstream commit
# 54c625c380ef5500f17460981a3c67b109b6a847.

[Distribution]
# Manual: "The distribution to install in the image."
# Omission lets the host influence selection; the development image is Debian.
Distribution=debian
# Manual: "The release of the distribution to install in the image."
# Omission uses a tool default rather than the approved Debian 13 release.
Release=trixie
# Manual: "The architecture to build the image for."
# Omission uses the host architecture and hides a target change.
Architecture=x86-64
# Manual: "The mirror to use for downloading the distribution packages."
# Omission uses Debian's live default mirror. sandbox-target supplies the two
# authenticated archive families at this same dated snapshot.
Mirror=https://snapshot.debian.org/archive/debian/20260912T000000Z
# Manual: repository signature and key checks are "enabled by default."
# State it explicitly so trimming a default cannot create an unsigned build.
RepositoryKeyCheck=yes

[Output]
# Manual: Format selects "the image format type to generate."
# Disk produces the raw GPT artifact required by the development milestone.
Format=disk
# Manual: CompressOutput configures compression for the resulting image.
# Its v25.3 default is zstd; disable it to retain a directly bootable raw disk.
CompressOutput=no
# Manual: ImageId is "a short identifier for the image."
# Omission produces the generic image identifier and less useful artifacts.
ImageId=mule-development
# Manual: ManifestFormat controls the generated package-manifest representation.
# JSON is machine-readable input to GAP-09C provenance and SBOM work.
ManifestFormat=json
# Manual: Seed overrides systemd-repart's seed and makes partition metadata
# deterministic. Omission uses a random UUID. This UUIDv5 is derived from
# https://feral-mule.invalid/FML-ADR-079/development-image.
Seed=0cb850a0-e8dd-5310-91f3-f9db6a8a94f9

[Content]
# Manual: WithRecommends controls whether recommended dependencies install and
# defaults to no. State it so the locked closure cannot expand by default drift.
WithRecommends=no
# Manual: WithDocs is "Enabled by default." Keep Debian copyright files for
# FML-ADR-081 licence evidence even if a future tool default changes.
WithDocs=yes
# Manual: CleanPackageMetadata removes package databases and repository
# metadata. Keep them through mkosi.finalize so debsbom can inspect authenticated
# package metadata; that script removes them after emitting the SBOM.
CleanPackageMetadata=no
# Manual: KernelCommandLine is used "when building images." The serial console
# and named systemd target make the QEMU acceptance result observable.
KernelCommandLine=console=ttyS0 systemd.unit=multi-user.target systemd.show_status=yes
# Manual: Bootable "enables or disables generation of a bootable image."
# Omission is auto and can succeed without a kernel or bootloader.
Bootable=yes
# Manual: Bootloader defaults to systemd-boot; explicit selection prevents drift.
Bootloader=systemd-boot
# Manual: SourceDateEpoch clamps file modification times to the given timestamp.
# This is 2026-09-12T00:00:00Z, the approved snapshot date.
SourceDateEpoch=1789171200

[Build]
# Manual: SandboxTrees is for package-manager configuration because mkosi
# invokes package managers outside the image. The target tree contains only the
# dated main and security sources selected by FML-ADR-081.
SandboxTrees=sandbox-target
# Manual: ToolsTree selects the environment containing programs mkosi executes.
# Omission keeps using host programs; default builds the governed tools tree.
ToolsTree=default
# Manual: ToolsTreeDistribution selects the distribution for the tools tree.
# On an Ubuntu host the default is Debian; state it for every supported host.
ToolsTreeDistribution=debian
# Manual: ToolsTreeRelease selects the release for the default tools tree.
# Omission uses mkosi's hardcoded default, which v25.3 reports as testing.
ToolsTreeRelease=trixie
# Manual: ToolsTreeMirror selects the tools-tree distribution mirror.
# Omission uses its default mirror and defeats the dated-snapshot boundary.
ToolsTreeMirror=https://snapshot.debian.org/archive/debian/20260912T000000Z
# Manual: ToolsTreeSandboxTrees is the tools-tree form of SandboxTrees. It adds
# the same-time builder-only backports source without exposing it to the target.
ToolsTreeSandboxTrees=sandbox-tools
# Debian trixie-backports package selected by FML-ADR-081.
ToolsTreePackages=debsbom=0.10.1-1~bpo13+1

[Runtime]
# Manual: VirtualMachineMonitor defaults to qemu; state the accepted VM path.
VirtualMachineMonitor=qemu
# Manual: Console defaults to interactive. Read-only prevents a boot test from
# becoming an undocumented configuration channel.
Console=read-only
# Manual: RuntimeNetwork defaults to user. FML-ADR-081 requires the QEMU boot
# to run without WAN, so the opposite default is recorded explicitly.
RuntimeNetwork=none
