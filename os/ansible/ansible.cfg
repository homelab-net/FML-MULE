# Ansible configuration for MULE host provisioning.
#
# Kept minimal and explicit. A setting here changes behaviour for every
# contributor, so add one only with a reason.

[defaults]
inventory = inventory/example.yml
roles_path = roles
host_key_checking = True
# Deliberately True. Disabling it is a common convenience that removes the only
# check that a node is the node you think it is. See SECURITY.md.

stdout_callback = default
display_skipped_hosts = False
interpreter_python = auto_silent
retry_files_enabled = False
# Retry files are local state that is easy to commit by accident.

[ssh_connection]
pipelining = True
