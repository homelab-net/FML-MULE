---
# Region profile: United States, 902-928 MHz.
#
# Status: UNVERIFIED. Every parameter below is TBD. Nothing here has been
# verified against the rules, and no module or channel has been selected.
#
# Consumed by configuration generation. Every value here is a regulatory or
# planning parameter for one region. No file in os/config/ contains a
# frequency, channel, bandwidth or transmit power; they come from here.
#
# Rules:
#   - Unknown values are the string "TBD". Never a plausible-looking number.
#   - Every parameter cites the rule it derives from, in `source`.
#   - Nothing in this file authorises operation or confers compliance.
#     See REGULATORY.md.

region:
  id: us-915                  # Matches the directory name.
  name: "United States, 902-928 MHz"
  administration: "United States"
  regulator: "FCC"
  status: UNVERIFIED          # UNVERIFIED until someone who operates here confirms it
  verified_by: TBD            # Who confirmed this profile, and when

# Sub-GHz bearer: Wi-Fi HaLow, IEEE 802.11ah.
halow:
  permitted: TBD              # true or false. Whether HaLow is permitted at all here.
  band_low_hz: TBD
  band_high_hz: TBD
  channel_widths_hz: []       # e.g. [1000000, 2000000, 4000000]
  default_channel: TBD        # Trade: TBR-RF-02
  max_eirp_dbm: TBD
  max_antenna_gain_dbi: TBD
  duty_cycle_percent: TBD     # "none" where no duty-cycle limit applies
  source: TBD                 # Regulation and section, e.g. "47 CFR 15.247"

# Independent low-bandwidth plane: LoRa.
lora:
  permitted: TBD
  band_low_hz: TBD
  band_high_hz: TBD
  default_channel: TBD
  max_eirp_dbm: TBD
  duty_cycle_percent: TBD
  source: TBD

# Conventional Wi-Fi: inter-node bearer and EUD access point.
# These are separate logical radio functions; see FML-ADR-045.
wifi:
  # AP RF parameters set by Owner decision 2026-09-21 (TBR-RF-03 AP-params
  # sub-decision only; the trade's radio-consolidation/hardware half stays OPEN).
  # Baseline: dual-band permitted, 5 GHz preferred as the AP primary; migrate the
  # AP to 2.4 GHz when achievable EIRP / coverage on 5 GHz is inadequate. That
  # migration trigger is hardware-measured (the "too low" coverage floor is
  # quantified on real hardware, TBR-RF-03's hardware half); both bands are
  # permitted here so the 2.4 fallback needs no re-approval -- it is a re-point of
  # ap_channel, not a schema change. See
  # docs/evidence/TBR-RF-03/2026-09-21-ap-channel-and-eirp-decision-packet.md
  permitted_bands: ["2.4GHz", "5GHz"]
  mesh_channel: TBD           # Trade: TBR-RF-01 (not set here)
  # 5 GHz UNII-3, non-DFS, outdoor-permitted; recommended primary. The Owner may
  # override the specific channel.
  ap_channel: 149
  # Regulatory ceiling (FCC 47 CFR 15.247 P2MP), not operating power; applies to
  # UNII-3 and the 2.4 GHz fallback. Operating EIRP is hardware-bounded, set below.
  max_eirp_dbm: 36
  indoor_only_channels: []    # UNII-3 (149) and 2.4 (1/6/11): not indoor-only
  dfs_required: false         # ch 149 and 2.4 (1/6/11) are non-DFS
  # Regulatory basis for the values above.
  source: >-
    FCC 47 CFR Part 15.247 (2.4 GHz + 5 GHz UNII-3) and 15.407 (5 GHz UNII);
    Owner decision 2026-09-21

# Amateur radio integration is disabled by default everywhere.
# Enabling it requires a licensed control operator, station identification, and
# lawful content handling. Encrypted traffic is not permitted on amateur
# allocations in many jurisdictions. See REGULATORY.md.
amateur:
  enabled: false              # Never default this to true in any region profile
  permitted_in_region: TBD
  encryption_permitted: TBD
  source: TBD

# Notes that do not fit a field above. Constraints with design consequences
# rather than only configuration consequences belong here and in the README.
notes: TBD
