---
# Lint and document validation.
#
# THERE IS NO BUILD OR TEST WORKFLOW, because there is nothing to build. The
# first functional code in this repository is the image build pipeline, and it
# does not exist yet. See AGENTS.md: build system before application code.
#
# WHAT A GREEN RUN MEANS
#
# The files parse, the linters are satisfied, the fakes pass, and the documents
# are internally consistent. THAT IS ALL.
#
# CI HAS NO RADIOS, NO BATTERY, AND NO ENCLOSURE. A green run says nothing
# about whether a radio enumerates, whether a mesh forms, whether the node
# survives a day on battery, or whether it stays cool in an enclosure.
# Hardware-in-the-loop verification belongs to the qualification stages. See
# test/README.md.
#
# This is also why the repository carries no badges.

name: Lint

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a credential that reached an earlier commit is
          # published, and removing the tip commit does not undo that.
          fetch-depth: 0

      # The pinned binary rather than gitleaks-action, so that the scanner a
      # contributor runs and the scanner CI runs are the same build. The action
      # resolved its own version, and Debian's package answers "version is set
      # by build process" when asked, so neither end could say what scanned.
      #
      # Given up by not using the action: its inline pull request annotations.
      # A finding still fails the job and is printed, redacted, in the log.
      - name: Install the pinned gitleaks
        run: tools/install-deps.sh --only gitleaks

      - name: Scan for committed secrets
        # The same invocation tools/lint.sh uses. .gitleaks.toml is picked up
        # from the repository root.
        run: gitleaks detect --no-banner --redact --source .

  documents:
    name: Document validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate the ADR and trade registers
        run: tools/validate-docs.sh

      - name: Check that STATUS.md is not stale
        # STATUS.md is generated and never hand-edited. A stale status page is
        # how a repository signals abandonment.
        run: tools/gen-status.sh --check

      - name: Check requirement traceability
        # Fails when any binding requirement lacks an architecture allocation
        # or a validating stage. A requirement with no validating stage is a
        # defect. The requirement set is not yet populated; the check is wired
        # up so the first requirement lands into working machinery.
        run: tools/gen-traceability.sh --check

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install markdownlint-cli2
        run: tools/install-deps.sh --only node

      - name: Lint Markdown
        run: markdownlint-cli2 "**/*.md"

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # tools/install-deps.sh is the single source of toolchain versions
      # (FML-ADR-058). Restating the package list or the shfmt version here
      # would put it in two places, and the two would drift.
      - name: Install the shell toolchain
        run: tools/install-deps.sh --only apt,shfmt

      - name: shellcheck
        # -x so sourced files are followed; see the note in tools/lint.sh.
        run: shellcheck -x tools/*.sh

      - name: shfmt
        run: shfmt -d -i 2 -ci tools/*.sh

      - name: Shell unit tests
        # These plant violations in a throwaway copy of the tree and assert
        # each check catches them. A checker that has never been shown to fail
        # has not been tested.
        run: bats test/unit

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 3.13 is Debian stable's Python, which FML-ADR-022 selects, and is the
      # interpreter tools/requirements-dev.txt was resolved against. Running a
      # different one here would mean CI installs a set nobody resolved.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the pinned Python toolchain
        run: |
          tools/install-deps.sh --only python
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: ruff lint
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: Validate mission packages
        run: python tools/validate-mission.py

      # Unit tests and the flat-sat scenarios. Neither needs a radio; see
      # test/README.md for what a green run does and does not mean.
      - name: Python tests
        run: pytest

      # An uncovered line in mule/ is a decision nobody tested or code nobody
      # can reach. Two unreachable "safety nets" have been shipped here.
      - name: Production package is fully covered
        run: sh tools/coverage-check.sh

  arm64:
    name: Toolchain resolves for arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the pinned Python toolchain
        run: tools/install-deps.sh --only python

      # FML-ADR-022 selects Debian; the compute element is unselected but
      # expected to be an arm64 board, because this is a portable field
      # appliance. Every version in the repository is nonetheless resolved on
      # x86_64, because that is what CI and the contributors have. A refreshed
      # lock can lose arm64 support silently, on a machine where nothing tries
      # it, so this asks on every run.
      #
      # It proves resolvability, not function: nothing here executes an arm64
      # binary. See the header of the script.
      - name: Check the toolchain resolves for arm64
        run: tools/check-toolchain-arm64.sh

  yaml:
    name: YAML and Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the pinned Python toolchain
        run: |
          tools/install-deps.sh --only python
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint os/ansible

      - name: Ansible syntax check
        # --syntax-check and --check are the minimum bar. They confirm the
        # playbook parses and the tasks are well-formed. They confirm nothing
        # works: there is no host, and there are no radios.
        run: |
          ansible-playbook -i os/ansible/inventory/example.yml \
            os/ansible/site.yml --syntax-check
