---
# Does batman-adv actually route between nodes, with no radios?
#
# The network plane is the only part of this system nobody without hardware can
# review, and os/config/batman-adv.conf.template is entirely TBD. This forms a
# real three-node batman-adv mesh in network namespaces and routes traffic two
# hops across it. No radios, no hardware, ordinary Linux.
#
# WHAT THIS DOES AND DOES NOT COVER
#
# Covered, and real: the batman-adv module, BATMAN_V as the routing algorithm
# (FML-ADR-024), originator and neighbour exchange, translation-table learning,
# and multi-hop forwarding. The kernel code path is the one a node runs.
#
# NOT covered: 802.11s association, and everything RF. The link layer here is a
# veth pair, which is a perfect wire: no propagation, no loss, no contention, no
# rate adaptation, no desense, no range. Every quantity TBR-RF-01, TBR-RF-02 and
# TBR-RF-03 exist to measure is absent, and a mesh that forms here says nothing
# about a mesh forming in a car park.
#
# WHY NOT 802.11s HERE
#
# Recorded from two probe runs rather than assumed. GitHub hosted runners use an
# Azure kernel flavour with no wireless stack at all:
#
#   /lib/modules/6.17.0-1022-azure/kernel/drivers/net/wireless/  does not exist
#   /lib/modules/6.17.0-1022-azure/kernel/net/batman-adv/        batman-adv.ko.zst
#
# Both of those readings are AFTER installing linux-modules-extra, which the
# base runner image does not carry. That package supplies batman-adv and does
# not supply any wireless driver, hwsim included. So mac80211_hwsim cannot load
# and 802.11s cannot be exercised on a hosted runner. It needs a machine with an
# ordinary distribution kernel. The step below records that state on every run,
# so the day it changes, this file finds out rather than someone guessing.

name: Mesh probe

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mesh-probe.yml"

permissions:
  contents: read

jobs:
  batman:
    name: Three-node batman-adv mesh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install batctl, iproute2 and the extra kernel modules
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq batctl iproute2 iw tcpdump
          # batman-adv is NOT in the runner's base module set. It ships in
          # linux-modules-extra, and without this modprobe fails with "not
          # found in directory /lib/modules/<kernel>". Dropping this line is
          # what broke probe run 3.
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
          batctl -v
          ls "/lib/modules/$(uname -r)/kernel/net/batman-adv/"

      - name: Record whether a wireless stack exists on this runner
        run: |
          echo "kernel: $(uname -r)"
          if [ -d "/lib/modules/$(uname -r)/kernel/drivers/net/wireless" ]; then
            echo "WIRELESS PRESENT. mac80211_hwsim may now be possible;"
            echo "802.11s association could be added to this probe."
            ls "/lib/modules/$(uname -r)/kernel/drivers/net/wireless/"
          else
            echo "NO WIRELESS STACK. 802.11s cannot be exercised on this runner."
            echo "This is the expected state; see the header of this file."
          fi

      - name: Load batman-adv and find out which routing algorithms exist
        run: |
          sudo modprobe batman-adv
          lsmod | grep batman
          sudo dmesg | grep -i batman_adv | tail -5

          # FML-ADR-024 selects BATMAN_V. Whether the module supports it is a
          # build-time option, CONFIG_BATMAN_ADV_BATMAN_V, and the stock
          # distribution module may be built without it. Probe run 4 found
          # exactly that: "Routing algorithm 'BATMAN_V' is not supported".
          #
          # So ask rather than assume, and carry the answer forward. The
          # topology below runs on whatever is available, and the last step
          # reports loudly when that is not what the ADR selected.
          if sudo batctl routing_algo BATMAN_V 2>/tmp/algo_err; then
            echo "ALGO=BATMAN_V" >> "$GITHUB_ENV"
            echo "ADR_ALGO_AVAILABLE=yes" >> "$GITHUB_ENV"
            echo "BATMAN_V available."
          else
            cat /tmp/algo_err
            echo "ALGO=BATMAN_IV" >> "$GITHUB_ENV"
            echo "ADR_ALGO_AVAILABLE=no" >> "$GITHUB_ENV"
            echo "BATMAN_V UNAVAILABLE in this module build."
            echo "Falling back to BATMAN_IV to exercise the topology."
          fi
          sudo batctl routing_algo

      - name: Build a line topology, node1 - node2 - node3
        run: |
          # A line, not a full mesh: node1 and node3 share no link, so reaching
          # node3 from node1 requires batman-adv to route through node2. A full
          # mesh would prove only that two directly wired hosts can ping.
          for n in 1 2 3; do sudo ip netns add "node$n"; done

          sudo ip link add veth12 type veth peer name veth21
          sudo ip link add veth23 type veth peer name veth32

          sudo ip link set veth12 netns node1
          sudo ip link set veth21 netns node2
          sudo ip link set veth23 netns node2
          sudo ip link set veth32 netns node3

          for n in 1 2 3; do
            sudo ip netns exec "node$n" ip link set lo up
          done
          # batman-adv adds its own header, so a 1500 byte hard interface makes
          # every full-size frame fragment at layer 2. The module says so on
          # every interface add: "Setting the MTU to 1560 would solve the
          # problem." This is a real configuration value, not a probe detail,
          # and it belongs in os/config/batman-adv.conf.template.
          sudo ip netns exec node1 ip link set veth12 mtu 1560 up
          sudo ip netns exec node2 ip link set veth21 mtu 1560 up
          sudo ip netns exec node2 ip link set veth23 mtu 1560 up
          sudo ip netns exec node3 ip link set veth32 mtu 1560 up

      - name: Attach each node to the mesh
        run: |
          attach() {
            ns=$1; shift
            sudo ip netns exec "$ns" batctl routing_algo "$ALGO"
            for hard in "$@"; do
              sudo ip netns exec "$ns" batctl meshif bat0 interface add "$hard"
            done
            # Both default to on and both intercept broadcast. The
            # distributed ARP table answers ARP from a mesh-wide cache instead
            # of flooding, and multicast optimisation suppresses flooding to
            # nodes not known to want the group. Run 7 had correct originator
            # and translation tables with a permanently empty ARP cache, which
            # is what an ARP request that never gets answered looks like.
            #
            # Turning both off is also the right default to establish for MULE:
            # os/config/batman-adv.conf.template carries multicast_mode as TBD,
            # and CONOPS section 35 keeps LoRa a separate non-IP plane, so
            # there is no mesh-wide multicast story to optimise for yet.
            sudo ip netns exec "$ns" batctl meshif bat0 distributed_arp_table 0
            sudo ip netns exec "$ns" batctl meshif bat0 multicast_mode 0
            sudo ip netns exec "$ns" ip link set bat0 up
          }
          attach node1 veth12
          attach node2 veth21 veth23
          attach node3 veth32

          # Addresses go on bat0, never on the hard interfaces. batman-adv is a
          # layer 2 protocol: the mesh is one flat broadcast domain and IP sits
          # on top of it. Addressing the hard interfaces instead is the mistake
          # that makes a mesh look like it works while bypassing it entirely.
          sudo ip netns exec node1 ip addr add 10.42.0.1/24 dev bat0
          sudo ip netns exec node2 ip addr add 10.42.0.2/24 dev bat0
          sudo ip netns exec node3 ip addr add 10.42.0.3/24 dev bat0

      - name: Wait for the mesh to converge
        run: |
          # Convergence is not instant: originator messages are periodic. Poll
          # for the real thing rather than sleeping a guessed interval.
          #
          # The check counts originator ENTRIES, which batctl prefixes with
          # " * ". An earlier version matched '^[* ]', which also matches the
          # column header, so it reported convergence after one second and
          # pinged a mesh that had not formed. A check that passes on a header
          # is not a check.
          converged=no
          for i in $(seq 1 45); do
            n=$(sudo ip netns exec node1 batctl meshif bat0 originators |
                  grep -cE '^ \* +([0-9a-f]{2}:){5}[0-9a-f]{2}' || true)
            if [ "$n" -ge 2 ]; then
              echo "node1 sees $n originators after ${i}s"
              converged=yes
              break
            fi
            sleep 1
          done
          echo "--- node1 originators ---"
          sudo ip netns exec node1 batctl meshif bat0 originators
          echo "--- node1 neighbours ---"
          sudo ip netns exec node1 batctl meshif bat0 neighbors
          echo "--- node1 global translation table ---"
          sudo ip netns exec node1 batctl meshif bat0 transglobal || true
          test "$converged" = yes

      - name: Watch all four points between node1 and node2
        run: |
          # Nine runs were spent reading batctl tables, which report what the
          # mesh believes about itself. They have been consistently correct and
          # consistently unhelpful. This watches the wire instead.
          #
          # A packet from node1 to node2 crosses four observable points:
          #
          #   node1 bat0    entering the mesh
          #   node1 veth12  leaving the node, encapsulated
          #   node2 veth21  arriving on the far side of the wire
          #   node2 bat0    decapsulated and delivered upward
          #
          # Whichever is the last to see it is where the packet dies. This
          # cannot be inferred from a translation table and should have been
          # the second thing tried, not the tenth.

          # Pin both caches so ARP is not in the question. Run 9 established
          # that ARP is not the fault.
          mac1=$(sudo ip netns exec node1 cat /sys/class/net/bat0/address)
          mac2=$(sudo ip netns exec node2 cat /sys/class/net/bat0/address)
          sudo ip netns exec node1 ip neigh replace 10.42.0.2 \
            lladdr "$mac2" dev bat0 nud permanent
          sudo ip netns exec node2 ip neigh replace 10.42.0.1 \
            lladdr "$mac1" dev bat0 nud permanent

          echo "node1 bat0 $mac1 / node2 bat0 $mac2"

          capture() {
            sudo ip netns exec "$1" timeout 14 tcpdump -i "$2" -nn -e -c 40 \
              >"/tmp/$1-$2.txt" 2>"/tmp/$1-$2.err" &
          }
          capture node1 bat0
          capture node1 veth12
          capture node2 veth21
          capture node2 bat0
          sleep 3

          echo "--- counters before ---"
          sudo ip netns exec node1 ip -s link show bat0 | tail -4
          sudo ip netns exec node1 ip -s link show veth12 | tail -4
          sudo ip netns exec node2 ip -s link show veth21 | tail -4
          sudo ip netns exec node2 ip -s link show bat0 | tail -4

          sudo ip netns exec node1 ping -c 4 -i 1 -W 3 10.42.0.2 || true
          sleep 2

          echo "--- counters after ---"
          sudo ip netns exec node1 ip -s link show bat0 | tail -4
          sudo ip netns exec node1 ip -s link show veth12 | tail -4
          sudo ip netns exec node2 ip -s link show veth21 | tail -4
          sudo ip netns exec node2 ip -s link show bat0 | tail -4

          wait 2>/dev/null || true
          for f in node1-bat0 node1-veth12 node2-veth21 node2-bat0; do
            echo
            echo "=========== $f ==========="
            grep -v -e 'BATADV' -e 'ethertype Unknown' "/tmp/$f.txt" |
              head -12 || true
            echo "(lines captured: $(wc -l <"/tmp/$f.txt"))"
            head -2 "/tmp/$f.err" || true
          done

      - name: Say where the packet died
        if: always()
        run: |
          echo "--- batman-adv counters, node1 then node2 ---"
          for n in node1 node2; do
            echo "=== $n ==="
            sudo ip netns exec "$n" batctl meshif bat0 statistics 2>/dev/null |
              grep -vE ' 0$' || true
          done
          echo
          echo "Read the four captures above in order. The last one to show an"
          echo "ICMP echo request is the point at which the packet stopped."

      - name: Diagnostics on failure
        if: failure()
        run: |
          # Deliberately narrow. An earlier version dumped every table for all
          # three nodes and buried the isolation verdict under ninety lines,
          # which made the run harder to read than the one before it.
          for n in node1 node2; do
            echo "=============== $n ==============="
            sudo ip netns exec "$n" ip -brief addr || true
            sudo ip netns exec "$n" ip neigh || true
            sudo ip netns exec "$n" batctl meshif bat0 statistics || true
          done
          sudo dmesg | grep -i batman | tail -12 || true
