---
# Service topology. OpenTAKServer has the full graph and cold-start case;
# Quadlet generation also checks the enabled Martin unit.
#
# Static composition does not start a container. Quadlet dry-run asks the
# generator to accept the units, including Notify=healthy. The cold-start
# job installs the materialized units for an unprivileged account and lets
# systemd start the target. It does not launch the containers itself.
#
# A green run is not mesh readiness and not a different-node restore. The
# mesh interface name is still TBR-LINUX-01. The runner holds a same-named
# user unit so the dependency edge can be observed. CI has no radios.
# Stopping the target and starting it again is not a Restart= policy.
name: Topology

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static composition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check the TAK graph and its mutations
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python test/topology/validate.py

  quadlet:
    name: Quadlet generation
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install a systemd-enabled Podman
        run: sudo sh test/topology/ensure-podman.sh
      - name: Generate the units
        run: sh test/topology/quadlet-dry-run.sh

  tak:
    name: TAK cold start
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install a systemd-enabled Podman
        run: sudo sh test/topology/ensure-podman.sh
      - name: Start the target and persist one CoT
        run: sh test/topology/cases/tak/cold-start.sh
