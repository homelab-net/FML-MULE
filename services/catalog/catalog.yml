---
# The set of services approved to run on a MULE node. FML-ADR-078.
#
# This is the machine-readable form of the catalog described in README.md. A
# mission package may only enable a service that has an entry here; a separate
# validator (tools/validate-catalog.py) enforces that, which the mission JSON
# schema cannot.
#
# Trade-blocked fields carry the string "TBD" and name the trade that will
# supply the value, the same discipline region profiles use. A TBD here is an
# honest "not measured or not selected yet", never a placeholder number. An
# entry records an approved *catalog contract*. Only an entry with enabled=true
# and an existing loadable unit may be selected by a mission.
services:
  - name: opentakserver
    enabled: false
    aliases: []
    # Deployment root is the target, including while this contract is disabled.
    # The file on disk is opentakserver.target.disabled until enabled is true.
    # GAP-09F has not selected the v0.0.1 service. The image is still TBD.
    unit: opentakserver.target
    bundle:
      - ots.network
      - postgresql.container
      - rabbitmq.container
      - opentakserver.container
      - eud-handler.container
      - cot-parser.container
    purpose: "The TAK server a phone connects to for situational awareness."
    # No complete official OCI image is published upstream; a digest-pinned
    # build must be defined before deployment. TBR-TAK-01, and see
    # docs/prior-art/opentakserver.md.
    image: TBD
    upstream:
      project: OpenTAKServer
      url: "https://github.com/brian7704/OpenTAKServer"
      license: "GPL-3.0-or-later"
    # Target is rootless under Podman (FML-ADR-029); the hardening review is open.
    rootless: TBD
    # Measured memory and CPU under representative load. TBR-COMP-01.
    resource_envelope: TBD
    exposed_to: [eud_ap, mesh]
    # OTS holds mission-critical TAK state that must survive node loss. The
    # durable set is decided: TBR-TAK-01 closed under FML-ADR-071.
    durable_state: true
    # Automatic recovery policy remains TBR-HA-01.
    recovery: TBD
    region_dependency: false
    adr: FML-ADR-078

  - name: martin
    enabled: true
    aliases: []
    # Owner-selected for v0.0.1 on 2026-09-24 (GAP-09F/G).
    unit: martin.container
    purpose: "Serves the local map tiles to an EUD as z/x/y (FML-ADR-073)."
    # Official Martin 1.16.1 multi-arch image index, resolved 2026-09-24.
    image: "ghcr.io/maplibre/martin@sha256:59902019bf9038926ff0c71174237d6852e64c457830a6349abe7090be8818ca"
    upstream:
      project: Martin
      url: "https://github.com/maplibre/martin"
      license: "MIT OR Apache-2.0"
    rootless: true
    # SIMULATED bench measured ~8.5 MB idle / 27-30 MB peak RSS on x86-64, which
    # is not a target-hardware figure. TBR-COMP-01.
    resource_envelope: TBD
    exposed_to: [eud_ap]
    # Map/tile/cache state is not TAK-server state and need not survive node loss.
    durable_state: false
    # Automatic recovery policy remains TBR-HA-01.
    recovery: TBD
    region_dependency: false
    adr: FML-ADR-078
