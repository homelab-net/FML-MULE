# SYNTHETIC TEST FIXTURE. NOT A REGION PROFILE.
#
# Every number in this file is invented. None of them describes any real
# regulatory allocation in any jurisdiction. This file exists so that
# tools/gen-config.py can be exercised on its resolution and validation paths,
# which is impossible against regions/, where every value is correctly TBD.
#
# The xx- prefix is reserved for fixtures and is not a valid economic area or
# country code. This file cannot be loaded by region identifier; it must be
# passed as an explicit path. See test/fixtures/regions/README.md.
#
# DO NOT COPY ANY VALUE FROM THIS FILE INTO regions/.
#
# DELIBERATELY INVALID: HaLow is marked not permitted in this region, yet a
# default_channel is still declared for it. tools/gen-config.py must REJECT
# it rather than resolving a channel for a bearer the region forbids.

region:
  id: xx-testfixture
  name: "Synthetic test fixture, not a real region"
  administration: "None. This is a test fixture."
  regulator: "None. This is a test fixture."
  status: FIXTURE
  verified_by: "n/a, synthetic"

halow:
