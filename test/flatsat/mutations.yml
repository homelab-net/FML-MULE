---
# Mutations for tools/mutation-check.py.
#
# Each entry breaks the node or the configuration generator in one specific,
# semantically meaningful way. The suite is expected to FAIL for every one of
# them. A mutation the suite still passes is called a survivor, and a survivor
# is a defect the tests cannot see.
#
# Why this file is data rather than code: the mutations are the specification
# of what the suite must be able to detect. Keeping them here means the list
# can be reviewed, extended and argued about without reading a script, and it
# keeps tools/mutation-check.py free of the literals it operates on.
#
# Adding a mutation is how you record "the suite must notice this". If it
# survives, either write the missing test or delete the mutation with a reason.

mutations:
  # --- trust: FML-ADR-042 fail-closed behaviour ---------------------------
  - id: M01
    file: mule/admission.py
    describe: admission stops checking time at all, and so fails open
    find: "    if time.degraded:"
    replace: "    if False:"

  - id: M02
    file: mule/timekeeping.py
    describe: assess judges every reading credible
    find: "    if not readings.rtc_present():"
    replace: "    if False:"

  - id: M03
    file: mule/timekeeping.py
    describe: a retained time predating the running image is no longer caught
    find: "    if retained < policy.image_build_time:"
    replace: "    if False:"

  - id: M04
    file: mule/timekeeping.py
    describe: a depleted RTC backup cell is ignored
    find: "    if readings.rtc_backup_cell_ok() is False:"
    replace: "    if False:"

  - id: M05
    file: mule/timekeeping.py
    describe: system clock and RTC may disagree without limit
    find: "    if skew > policy.max_system_rtc_skew:"
    replace: "    if False:"

  - id: M06
    file: mule/timekeeping.py
    describe: credibility is decided before a trusted upstream is consulted
    find: "    if readings.synchronized():"
    replace: "    if False:"

  - id: M25
    file: mule/timekeeping.py
    describe: a timestamp with no timezone raises instead of failing closed
    find: "    if any(stamp.tzinfo is None for stamp in stamps):"
    replace: "    if False:"

  # --- admission ----------------------------------------------------------
  - id: M07
    file: mule/admission.py
    describe: a node that never booted still admits devices
    find: "    if not booted:"
    replace: "    if False:"

  - id: M08
    file: mule/admission.py
    describe: admission ignores whether the required bearers are serving
    find: "    if not_serving:"
    replace: "    if False:"

  - id: M09
    file: test/flatsat/node.py
    describe: an unadmitted device can resolve services
    find: |
      if device_id not in self._admitted:
                  return None
    replace: "if False:\n            return None"

  # --- configuration ------------------------------------------------------
  - id: M10
    file: tools/gen-config.py
    describe: a channel outside the permitted band is accepted
    find: "        elif not (low <= channel <= high):"
    replace: "        elif False:"

  - id: M11
    file: tools/gen-config.py
    describe: a TBD value no longer refuses generation
    find: "        raise UnresolvedValueError(message)\n\n    return {"
    replace: "        pass\n\n    return {"

  - id: M12
    file: tools/gen-config.py
    describe: a bearer the region forbids still gets a channel resolved
    find: "        if permitted is not True:"
    replace: "        if False:"

  - id: M13
    file: tools/gen-config.py
    describe: an unenforceable EIRP ceiling is accepted
    find: "        if not isinstance(eirp, (int, float)):"
    replace: "        if False:"

  - id: M14
    file: test/flatsat/node.py
    describe: services come from a list in the node rather than the package
    find: '                    self._params["mission"]["services"],'
    replace: '                    ["portal.field"],'

  - id: M15
    file: test/flatsat/node.py
    describe: radios come up even with no lawful configuration
    find: "enumerated = [str(b) for b in self._enumerated()] if resolved else []"
    replace: "enumerated = [str(b) for b in self._enumerated()]"

  - id: M26
    file: mule/services.py
    describe: a service name drops the deployment's local domain
    find: 'return f"{name}.{local_domain}" if local_domain else name'
    replace: "return name"

  - id: M27
    file: mule/power.py
    describe: the reserve margin is spent, inflating every runtime estimate
    find: "        * (1.0 - model.reserve_fraction)"
    replace: "        * 1.0"

  - id: M28
    file: mule/power.py
    describe: hosting shared services no longer costs anything
    find: >-
      model.hosting_load_w if hosting_shared_services else 0.0
    replace: "0.0"

  - id: M29
    file: mule/power.py
    describe: cold no longer derates the estimate
    find: "        for threshold, fraction in self.cold_derating:"
    replace: "        for threshold, fraction in ():"

  - id: M30
    file: mule/power.py
    describe: a node with no measured model invents a runtime anyway
    find: "    if model is None:"
    replace: "    if False:"

  # --- the status surface -------------------------------------------------
  - id: M16
    file: mule/status.py
    describe: status invents a projected runtime
    find: "projected_runtime_minutes=observed.power.projected_runtime_minutes,"
    replace: "projected_runtime_minutes=90,"

  - id: M17
    file: mule/status.py
    describe: the network is always reported healthy
    find: "network_degraded=_network_degraded(observed),"
    replace: "network_degraded=False,"

  - id: M18
    file: mule/status.py
    describe: the battery is always reported healthy
    find: >-
      battery_healthy=observed.battery_healthy if observed.battery_present
      else None
    replace: "battery_healthy=True"

  - id: M19
    file: mule/status.py
    describe: LoRa is always reported available
    find: "    return observed.lora_stack_responding is True"
    replace: "    return True"

  # The case that matters most on the lifeline bearer: a platform that cannot
  # tell whether its stack answers must not be read as one that said yes.
  # `is True` and `is not False` differ only when the value is None, which is
  # exactly the state FML-ADR-026's plane can be in and the one an operator
  # would be misled by.
  - id: M53
    file: mule/status.py
    describe: an unknown LoRa stack state is treated as available
    find: "    return observed.lora_stack_responding is True"
    replace: "    return observed.lora_stack_responding is not False"

  # --- bring-up ordering ---------------------------------------------------
  # A wrong order presents on a node as a radio fault, so these matter more
  # than the shape of the code suggests.
  - id: M54
    file: mule/bringup.py
    describe: a prerequisite that never happened is no longer a violation
    find: "        if earlier not in position or position[earlier] > position[later]:"
    replace: "        if position.get(earlier, -1) > position[later]:"

  - id: M55
    file: mule/bringup.py
    describe: ordering is never checked, so every sequence looks sound
    find: "        if earlier not in position or position[earlier] > position[later]:"
    replace: "        if False:"

  - id: M20
    file: mule/status.py
    describe: a sensor outside its envelope no longer raises a fault
    find: "    if observed.thermal.outside_envelope:"
    replace: "    if False:"

  - id: M21
    file: mule/status.py
    describe: thermal throttling no longer degrades the reported state
    find: "    if observed.thermal.throttling:"
    replace: "    if False:"

  - id: M22
    file: mule/status.py
    describe: EMCON is never reported
    find: "        emcon_active=observed.modes.emission == \"EMCON-SILENT\","
    replace: "        emcon_active=False,"

  - id: M23
    file: mule/status.py
    describe: a node missing a required bearer is not faulted
    find: "    if not observed.booted or missing:"
    replace: "    if not observed.booted:"

  - id: M31
    file: mule/thermal.py
    describe: a node with no limits claims to be inside an envelope anyway
    find: "    if limits is None:"
    replace: "    if False:"

  - id: M32
    file: mule/thermal.py
    describe: per-sensor limits are ignored, so a battery gets processor limits
    find: "        for name, warn, critical in self.per_sensor:"
    replace: "        for name, warn, critical in ():"

  - id: M33
    file: mule/thermal.py
    describe: a sensor exactly at its critical limit is treated as inside it
    find: "        if value >= critical_at:"
    replace: "        if value > critical_at:"

  - id: M34
    file: mule/thermal.py
    describe: throttling is withheld when the thermal state is unknown
    find: "    throttling = readings.throttling_reported()"
    replace: "    throttling = False"

  - id: M35
    file: mule/sysfs.py
    describe: millidegrees are read as degrees, off by a factor of a thousand
    find: "        return int(raw) / MILLIDEGREES_PER_DEGREE"
    replace: "        return float(int(raw))"

  - id: M36
    file: mule/sysfs.py
    describe: an unmapped thermal zone is guessed at instead of skipped
    find: "if sensor is None:\n                continue"
    replace: "if sensor is None:\n                sensor = 'processor'"

  - id: M37
    file: mule/sysfs.py
    describe: a platform with no throttle probe claims it is not throttling
    find: "            return None\n        return self._throttling_probe()"
    replace: "            return False\n        return self._throttling_probe()"

  # --- mule/modes.py ------------------------------------------------------
  - id: M38
    file: mule/modes.py
    describe: fitment is treated as capability, so an unlinked radio raises the rung
    find: "    linked = set(associated)"
    replace: "    linked = set(associated) | {'wifi_mesh'}"

  - id: M39
    file: mule/modes.py
    describe: the ladder is read worst first, putting a connected node on LoRa
    find: "    for bearer, rung in CAPABILITY_LADDER:"
    replace: "    for bearer, rung in reversed(CAPABILITY_LADDER):"

  - id: M40
    file: mule/modes.py
    describe: a node with nothing linked is reported at the top of the ladder
    find: "    return \"ISOLATED\""
    replace: "    return \"NOMINAL-IP\""

  - id: M41
    file: mule/modes.py
    describe: a node that cannot see a peer host claims there is none
    find: "        shared_tak = None\n        undetermined.append("
    replace: "        shared_tak = \"SERVERLESS-TAK\"\n        undetermined.append("

  - id: M42
    file: mule/modes.py
    describe: nothing reporting WAN is read as WAN confirmed absent
    find: "    if inputs.wan_reachable is None:"
    replace: "    if False:"

  - id: M43
    file: mule/modes.py
    describe: a node with no measured power model reports itself energy nominal
    find: "    if runtime is None:\n        energy = None"
    replace: "    if runtime is None:\n        energy = \"NOMINAL-ENERGY\""

  - id: M44
    file: mule/modes.py
    describe: with no economy threshold the node assumes it has energy to spare
    find: "    elif economy_below_minutes is None:\n        energy = None"
    replace: "    elif economy_below_minutes is None:\n        energy = \"NOMINAL-ENERGY\""

  - id: M45
    file: mule/modes.py
    describe: the deployment axis ignores whether an inter-node bearer linked
    find: "if any(bearer in linked for bearer in fitted)"
    replace: "if fitted"

  - id: M46
    file: mule/modes.py
    describe: a commanded axis is hardcoded instead of carried from its input
    find: "        emission=inputs.emission,"
    replace: "        emission=\"NORMAL-EMISSION\","

  - id: M47
    file: mule/modes.py
    describe: the environment axis is hardcoded instead of carried
    find: "        environment=inputs.environment,"
    replace: "        environment=\"LAB\","

  - id: M48
    file: mule/status.py
    describe: EMCON is decided again in status instead of read from the mode axes
    find: "    if observed.modes.emission == \"EMCON-SILENT\":"
    replace: "    if False:"

  - id: M49
    file: mule/status.py
    describe: the LoRa rung no longer reaches the operator as LOW-BANDWIDTH
    find: "    if observed.modes.bearer_capability == \"LOW-BANDWIDTH\":"
    replace: "    if False:"

  - id: M50
    file: mule/modes.py
    describe: a node that reaches no peer still claims the rung it associated at
    find: "    if peer_reachable is False:"
    replace: "    if False:"

  - id: M51
    file: mule/modes.py
    describe: an unmeasured peer is treated as unreachable and downgrades
    find: "    if peer_reachable is False:"
    replace: "    if peer_reachable is not True:"

  - id: M52
    file: mule/modes.py
    describe: the unmeasured-reachability gap is never recorded
    find: "    if inputs.peer_reachable is None and rung != \"ISOLATED\":"
    replace: "    if False:"

  # --- fixture honesty ----------------------------------------------------
  - id: M24
    file: test/flatsat/fakes.py
    describe: a fake may describe a radio linked without being present
    find: "        if absent:"
    replace: "        if False:"
