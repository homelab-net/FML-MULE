# Python project configuration for the FERAL MULE repository.
#
# FML-ADR-083 makes mule/ an image-built Python distribution. Repository tools
# and tests share its environment but are not included in that distribution.

[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fml-mule"
version = "0.0.1"
description = "Bounded node decision and configuration runtime for FERAL MULE"
readme = "README.md"
license = { text = "Apache-2.0" }
# 3.11 is the floor. Chosen because it is what current Debian-family stable
# releases carry, and the userland is Debian-family (FML-ADR-022). Raising it
# would mean requiring a Python a builder's own distribution does not ship.
requires-python = ">=3.11"
dependencies = [
  # The image installs these from the exact Debian package lock. The lower
  # bounds describe the runtime API contract, not an alternate resolver.
  "jsonschema>=4.19",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Installed by CI and by anyone running the full check set locally.
dev = [
  "coverage>=7.0",
  # FML-ADR-081: validate CycloneDX licence choices against SPDX's symbol set.
  "license-expression==30.4.1",
  "pytest>=7.0",
  "yamllint>=1.30",
  "ansible-lint>=6.0",
]

[tool.setuptools]
packages = ["mule"]

[tool.setuptools.data-files]
# FML-ADR-083: pip installs both the canonical mission schema and the static
# native unit from the same versioned distribution as the runtime code.
"share/fml-mule" = ["mission/schema/mission-package.schema.json"]
"lib/systemd/system" = ["os/systemd/mule-runtime.service"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint]
# Selected deliberately rather than by taking a default. Each family earns its
# place; anything not listed is not enforced, which is a decision rather than
# an oversight.
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "B",    # bugbear: likely bugs rather than style
  "UP",   # pyupgrade: keep to modern syntax for the pinned floor
  "ANN",  # type annotations. CONTRIBUTING.md requires them on public functions
  "D",    # docstrings
  "S",    # bandit: security findings
  "RUF",  # ruff's own rules
]
ignore = [
  # This repository documents at module and function level, not in a docstring
  # for every magic method or nested helper. D203/D213 conflict with D211/D212
  # respectively; the pairs cannot both be enabled.
  "D203",
  "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Tests may use assert, which bandit flags (S101), and do not need the full
# docstring set on every case. Nothing under mule/ is relaxed: FML-ADR-051 puts
# decision logic there precisely so it is held to production standards.
"test/**/*.py" = ["S101", "D103"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
# The repository root, so that `mule` imports the same way for a bare `pytest`
# as for `python -m pytest`. FML-ADR-051 makes mule/ a production package; how
# it is installed onto an image is left to a later implementation ADR, and
# until then tests import it from the tree.
pythonpath = ["."]
# test/unit holds unit tests; test/digital_twin holds the end-to-end software digital twin
# scenarios. Both run in CI, and neither needs a radio.
testpaths = ["test/unit", "test/digital_twin"]
python_files = ["test_*.py"]
addopts = "-ra"
